name: Application de bureau

on:
  push:
    branches: [main]
    paths:
      - "electron/**"
      - ".github/workflows/electron-build.yml"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # UNE SEULE IMAGE MAC : universal, qui contient Apple Silicon et
          # Intel. Les images par architecture echouent a la fabrication.
          - os: macos-latest
            label: macOS Universal
            cible: "--mac --universal"
          - os: windows-latest
            label: Windows
            cible: "--win --x64 --arm64"

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      # NUMERO DE VERSION CROISSANT, SINON PAS DE MISE A JOUR.
      # electron-updater ne propose une version que si elle est superieure a
      # celle installee. En restant a 1.0.0 a chaque construction, aucune mise
      # a jour n'aurait jamais ete proposee.
      - name: Numero de version
        shell: bash
        run: |
          V="1.0.${{ github.run_number }}"
          node -e "const f='package.json';const p=require('./'+f);p.version='$V';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "VERSION=$V" >> $GITHUB_ENV
          echo "version : $V"
        working-directory: electron

      - name: Dependances
        run: npm ci
        working-directory: electron

      - name: Verification syntaxe
        run: npm run verifier
        working-directory: electron

      - name: Construire ${{ matrix.label }}
        run: npx electron-builder ${{ matrix.cible }} --publish never
        working-directory: electron
        env:
          # LE CERTIFICAT APPLE, depuis les secrets du depot. electron-builder
          # attend le .p12 encode en base64 dans CSC_LINK. Cote Windows ces
          # variables n'existent pas, donc la recherche d'identite reste coupee
          # pour ne pas faire echouer la construction.
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && 'true' || 'false' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # NOTARISATION : elle s'allumera toute seule des que ces deux secrets
          # existeront. Sans eux, electron-builder signe et passe son chemin.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Brvndlab bureau ${{ env.VERSION }}
          body: "Application de bureau Brvndlab. Non signee : au premier lancement, clic droit puis Ouvrir sur Mac, Informations complementaires puis Executer quand meme sur Windows."
          # PUBLIEE, PAS EN BROUILLON : une release en brouillon est invisible
          # pour la recherche de mise a jour comme pour le lien de telechargement.
          draft: false
          make_latest: true
          # Les fichiers .yml sont le catalogue que lit la recherche de mise a
          # jour. Sans eux, l'application ne sait pas qu'une version existe.
          files: |
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/latest*.yml
