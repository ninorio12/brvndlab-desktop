# CONSTRUCTION DE L'APPLICATION DE BUREAU
#
# Un seul fichier pour macOS et Windows. La signature n'est PAS branchée ici :
# les identifiants Apple et Microsoft ne sont pas encore ouverts (voir README).
# Tel quel, `npm run construire` produit des binaires NON SIGNÉS, testables, et
# rien d'autre ne changera le jour où les certificats arrivent que d'ajouter
# quelques variables d'environnement.

appId: com.brvndlab.bureau
productName: Brvndlab
copyright: Brvndlab

directories:
  output: dist
  buildResources: ressources

# On n'embarque que ce qui tourne : le code du processus principal et le
# manifeste. Le SaaS lui-même vient du réseau, il n'y a rien d'autre à copier.
files:
  - src/**/*
  - package.json

# Le schéma de retour de connexion. C'est cette déclaration qui apprend au
# système que « brvndlab://... » nous appartient.
protocols:
  - name: Brvndlab
    schemes:
      - brvndlab

mac:
  category: public.app-category.productivity
  icon: ressources/icone.png
  # UN SEUL FICHIER POUR LES DEUX MACS. « universal » contient Apple Silicon et
  # Intel : personne n'a à savoir quelle puce il a dans sa machine.
  # Noms de fichiers STABLES (sans numero de version) : les liens de
  # telechargement du SaaS ne bougent donc jamais d'une version a l'autre.
  artifactName: Brvndlab-${arch}.${ext}
  # UNIVERSAL SEUL. Il contient deja Apple Silicon ET Intel : personne n'a a
  # savoir quelle puce il a. Les deux images separees ont ete tentees le 29/08
  # et echouent a la fabrication (hdiutil n'arrive pas a demonter le volume),
  # pour un gain qui n'existe pas cote utilisateur.
  target:
    - target: dmg
      arch:
        - universal
  # Le runtime durci est EXIGÉ par la notarisation. On le laisse allumé dès
  # maintenant pour que le jour où le compte Apple arrive, il n'y ait rien à
  # changer : seuls les identifiants manquent.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: ressources/droits.mac.plist
  entitlementsInherit: ressources/droits.mac.plist
  # NOTARISATION. Le compte Apple existe depuis le 30/08/2026 et le certificat
  # Developer ID est branche dans la chaine de construction. Il ne manque plus
  # que APPLE_ID et APPLE_APP_SPECIFIC_PASSWORD dans les secrets du depot :
  # tant qu'ils sont absents, electron-builder signe et saute la notarisation
  # sans faire echouer la construction.
  #
  # ATTENTION : signer NE SUFFIT PAS. Depuis Catalina, macOS exige la signature
  # ET le tampon de notarisation. Une application signee mais non notarisee
  # declenche encore l'avertissement au premier lancement.
  notarize: true

dmg:
  title: Brvndlab
  # Disposition PAR DEFAUT (application a gauche, dossier Applications a
  # droite) : les positions ecrites a la main faisaient echouer dmgbuild sur
  # les machines de compilation macOS le 29/08, avec un hdiutil qui n'arrivait
  # plus a demonter l'image. Le rendu par defaut est le meme.

win:
  icon: ressources/icone.png
  artifactName: Brvndlab-Setup-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  # Pas d'installation en un clic : on montre où ça s'installe et on laisse
  # choisir. Une application qui s'installe sans rien dire inquiète.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Brvndlab
  # Désinstallation propre : on efface aussi la session enregistrée.
  deleteAppDataOnUninstall: false

linux:
  # Pas une cible officielle, mais ça rend le dossier testable sur nos machines
  # de développement sans passer par un Mac.
  icon: ressources/icone.png
  category: Office
  target:
    - target: AppImage
      arch:
        - x64

# OÙ L'APPLICATION VA CHERCHER SES MISES À JOUR.
# GitHub Releases : c'est déjà là que vit le code, il n'y a pas d'hébergement
# supplémentaire à monter, et electron-updater sait lire ce format nativement.
# Tant qu'aucune version n'est publiée, la recherche échoue en silence (voir
# src/maj.js) : l'application marche, elle ne se met simplement pas à jour.
publish:
  provider: github
  # LA OU LES VERSIONS SONT REELLEMENT PUBLIEES. Le depot de Jonathan a GitHub
  # Actions eteint : aucune version n'y est jamais parue, donc la recherche de
  # mise a jour ne trouvait rien et echouait en silence. A rebasculer le jour ou
  # les Actions y seront rallumees.
  owner: ninorio12
  repo: brvndlab-desktop
  releaseType: release
